name: Deploy Dev ENV

on:
  push:
    branches:
      - develop  # Change this to the branch you want to deploy from

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Specify the Node.js version you need

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build:dev
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Install AWS CLI
      run: |
        sudo apt-get update
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Verify AWS CLI Installation
      run: aws --version

    - name: Debug AWS Configuration
      run: |
        aws s3 ls --region ${{ env.AWS_REGION }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3 and Invalidate CloudFront
      run: |
        # 1. Sync all static assets EXCEPT index.html to the dev bucket with long cache headers
        aws s3 sync dist/wallet-front-new/browser s3://${{ env.S3_BUCKET_NAME_DEV }}/ \
          --delete \
          --exclude "index.html" \
          --cache-control "public,max-age=31536000,immutable"

        # 2. Upload index.html with strict no-cache headers
        aws s3 cp dist/wallet-front-new/browser/index.html s3://${{ env.S3_BUCKET_NAME_DEV }}/index.html \
          --metadata-directive REPLACE \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html"

        # 3. Invalidate CloudFront (fastest way to push the new release)
        # We invalidate index.html so the browser immediately fetches the new version
        aws cloudfront create-invalidation --distribution-id E17A4DSJBQJRBU --paths "/index.html"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET_NAME_DEV: ${{ secrets.S3_BUCKET_NAME_DEV }}
