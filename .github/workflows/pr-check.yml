name: PR Build & Test Check

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install
        continue-on-error: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint check (if applicable)
        run: |
          if [ -f "package.json" ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "Lint script not found, skipping..."
          fi
        continue-on-error: true

      - name: Build application
        run: npm run build
        continue-on-error: false
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Assert AEO public artifacts
        run: |
          npm run assert:public-prerender
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const base = 'dist/wallet-front-new/browser';
          const pages = [
            'index.html',
            'features/index.html',
            'security/index.html',
            'faq/index.html',
            'guides/best-kaspa-wallet/index.html',
            'guides/create-kaspa-wallet/index.html',
            'guides/kaspa-desktop-wallet/index.html',
            'guides/kaspa-wallet-app/index.html',
            'guides/store-kaspa/index.html',
          ];

          function read(relativePath) {
            return fs.readFileSync(path.join(base, relativePath), 'utf8');
          }

          function assert(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          for (const file of ['llms.txt', 'robots.txt', 'sitemap.xml']) {
            assert(fs.existsSync(path.join(base, file)), `${file} missing`);
          }

          const robots = read('robots.txt');
          for (const bot of ['GPTBot', 'OAI-SearchBot', 'ChatGPT-User', 'ClaudeBot', 'Claude-SearchBot', 'PerplexityBot', 'Googlebot']) {
            assert(robots.includes(`User-agent: ${bot}`), `robots missing ${bot}`);
          }

          assert(read('llms.txt').includes('KaspaCom Wallet'), 'llms.txt missing brand');
          assert(read('sitemap.xml').includes('https://wallet.kaspa.com/guides/best-kaspa-wallet'), 'sitemap missing guide URL');

          for (const page of pages) {
            const html = read(page);
            assert(html.includes('type="application/ld+json"'), `${page} missing JSON-LD`);
            assert(html.includes('Last reviewed:'), `${page} missing last reviewed date`);
            assert(html.includes('content="index, follow"'), `${page} missing production index/follow robots`);

            const jsonLd = [...html.matchAll(/<script type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)];
            assert(jsonLd.length > 0, `${page} missing JSON-LD script`);
            for (const match of jsonLd) {
              JSON.parse(match[1]);
            }
          }
          NODE

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: false

      - name: Check build artifacts
        run: |
          if [ -d "dist" ]; then
            echo "✓ Build artifacts found"
            du -sh dist/
          else
            echo "✗ Build artifacts not found"
            exit 1
          fi
        continue-on-error: false

      - name: Upload coverage reports (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      # - name: Comment on PR with results
      #   if: always()
      #   uses: actions/github-script@v6
      #   with:
      #     script: |
      #       const buildStatus = '${{ job.status }}';
      #       const message = buildStatus === 'success'
      #         ? '✅ Build and tests passed successfully!'
      #         : '❌ Build or tests failed. Please check the logs above.';

      #       github.rest.issues.createComment({
      #         issue_number: context.issue.number,
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         body: message
      #       });

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mobile Safari remains a separate stabilization track. Keep PR gates focused
    # on deterministic desktop engines until the mobile-safari smoke suite is fixed.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v2
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # Only the project this matrix leg runs needs installing — pulling
        # all three (and their apt deps) on every leg was blowing most of
        # the 20-minute job timeout on redundant installs before a single
        # test ran.
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run @smoke on ${{ matrix.project }}
        run: npx playwright test --grep @smoke --project=${{ matrix.project }}
        env:
          CI: "true"
          KASPA_E2E_SEED: ${{ secrets.KASPA_E2E_SEED }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  e2e-funded:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Funded tests need the KASPACOM org-level KASPA_E2E_SEED secret. When
    # the secret is unset (forks, external contributors), the @funded test
    # self-skips via authenticateFundedWallet() — the job stays green for
    # visibility.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run funded-wallet E2E tests
        # Funded tests are Chromium-only by design — the cross-browser
        # signal lives in the e2e-smoke matrix; @funded asserts on-chain
        # state and doesn't need re-running per browser engine.
        run: npm run e2e:funded
        env:
          CI: "true"
          KASPA_E2E_SEED: ${{ secrets.KASPA_E2E_SEED }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-funded-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-funded-traces
          path: test-results/
          retention-days: 14

  security-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
