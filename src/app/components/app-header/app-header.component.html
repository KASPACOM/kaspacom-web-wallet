<header class="app-header">
  <h3 class="app-header-name">Kaspa Wallet</h3>
  @if (getWalletsWaitingActionsCount() !== 0) {
    <h3>
      You have {{ getWalletsWaitingActionsCount() }} pending actions
    </h3>
  }
  @if (getActiveWalletActionProcessors().length !== 0) {
    <h3>
      Active Wallets: {{ getActiveWalletActionProcessors().join(', ') }}
    </h3>
  }
  <h3 class="app-header-rpc-status">RPC STATUS: {{ getRpcConnectionStatus()() }}</h3>
</header>
