<div class="list-asset">
  <h2>List Asset</h2>

  <!-- Asset Selection -->
  @if (assets && assets.length > 0) {
    <div>
      <label for="assetInput" >Choose Asset:</label>
      <select id="assetInput" [(ngModel)]="selectedAsset">
        @for (asset of assets; track asset) {
          <option [value]="getAssetId(asset)">
            {{ asset.name }}
          </option>
        }
      </select>
    </div>
  } @else {
    <p>Loading...</p>
  }

  <!-- Amount Input -->
  <label for="amount">Amount:</label>
  <input
    id="amount"
    type="number"
    [(ngModel)]="amount"
    min="0"
    placeholder="Enter amount"
    />

  <!-- Address Input -->
  <label for="totalPrice">Total Price (KAS):</label>
  <input
    id="totalPrice"
    type="text"
    [(ngModel)]="totalPrice"
    placeholder="Enter total price in kaspa"
    />

  <!-- Send Button -->
  <button (click)="sendAsset()" [disabled]="!isFormValid()">Send</button>
</div>
