<div 
  class="account-settings-overlay"
  [class.open]="isOpen"
  (click)="onClose()"
>
  <div 
    class="account-settings-content" 
    [@slideDown]="isOpen ? 'open' : 'closed'"
    (click)="$event.stopPropagation()"
  >
    <h2 class="account-settings-title">Manage wallets</h2>
    
    <div class="wallets-container">
      <div class="wallets-list">
        @for (wallet of wallets(); track wallet.id) {
          <div 
            class="wallet-item"
            [class.selected]="wallet.isSelected"
            (click)="selectWallet(wallet)"
          >
            <div class="wallet-item__info">
              <div class="wallet-item__name">{{ wallet.name }}</div>
              <div class="wallet-item__address">{{ wallet.address | shortenAddress }}</div>
              <div class="wallet-item__balance">
                @if (wallet.isLoadingBalance()) {
                  <span class="balance-loading">Loading...</span>
                } @else if (wallet.balance() !== undefined) {
                  <span class="balance-amount">{{ wallet.balance() | number : '1.0-8' }} KAS</span>
                } @else {
                  <span class="balance-error">—</span>
                }
              </div>
            </div>
            <kc-icon
              class="wallet-item__delete"
              [iconClass]="'icon-delete'"
              [size]="'sm'"
              (click)="deleteWallet(wallet); $event.stopPropagation()"
              kcTooltip="Delete wallet"
              tooltipPosition="top-center"
            ></kc-icon>
          </div>
        }
      </div>
    </div>
    
    <div class="action-buttons">
      <kc-button
        [text]="'Add wallet'"
        [variant]="'primary'"
        [size]="'m'"
        [isFullWidth]="true"
        (buttonClick)="addWallet()"
      ></kc-button>
      <kc-button
        [text]="'Create wallet'"
        [variant]="'secondary'"
        [size]="'m'"
        [isFullWidth]="true"
        (buttonClick)="createWallet()"
      ></kc-button>
    </div>
  </div>
</div>
