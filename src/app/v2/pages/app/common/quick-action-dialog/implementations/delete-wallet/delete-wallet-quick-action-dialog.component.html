<app-quick-action-dialog
  [isOpen]="isDialogOpen"
  [title]="'Delete wallet'"
  [isCloseable]="true"
  (backdropClick)="onBackdropClick()"
  (close)="onClose()"
>
  <div slot="content" class="delete-confirmation">
    <p>
      Are you sure you want to delete the wallet <strong>{{ walletName }}</strong>?
      This will remove all accounts associated with this wallet from this device.
    </p>

    <div class="delete-confirmation__instructions">
      <span class="delete-confirmation__prompt">
        Type <strong>{{ deleteConfirmationPhrase }}</strong> to confirm.
      </span>
    </div>

    <kc-input
      class="delete-confirmation__input"
      [isFullWidth]="true"
      [placeholder]="deleteConfirmationPhrase"
      [ngModel]="confirmationInput"
      (valueChange)="onConfirmationChange($event)"
    ></kc-input>
  </div>

  <div slot="footer" class="button-row">
    <kc-button
      [text]="'Cancel'"
      [variant]="'tertiary'"
      [size]="'md'"
      [isFullWidth]="true"
      (buttonClick)="onCancel()"
    ></kc-button>
    <kc-button
      [text]="'Delete wallet'"
      [variant]="'secondary'"
      [role]="'danger'"
      [size]="'md'"
      [isFullWidth]="true"
      [isDisabled]="!canDelete"
      (buttonClick)="onDelete()"
    ></kc-button>
  </div>
</app-quick-action-dialog>
