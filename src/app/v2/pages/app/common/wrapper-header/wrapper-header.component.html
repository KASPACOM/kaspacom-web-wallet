<div class="header-container-home full-height">
  <div class="profile-section">
    <div class="profile-container" (click)="toggleAccountSettings()">
      <app-wallet-profile-orb class="profile-container__chain-icon"></app-wallet-profile-orb>
      <div class="profile-container__info">
        <div class="profile-container__wallet-name-section">
          <div class="profile-container__wallet-name">{{ walletName() }}</div>
        </div>
        <div class="profile-container__account-section">
          <div class="profile-container__account-name">{{ accountName() }}</div>
        </div>
      </div>
    </div>
    <app-copy-button class="external-copy-button" [value]="walletAddress()" [size]="'sm'"
      (click)="onCopyButtonClick($event)"></app-copy-button>
  </div>
  <div class="network-selection-section">
    <div class="network-info" (click)="onNetworkSelectionClick()">
      <div class="network-icon">
        @if (currentNetworkInfo().icon) {
          <img [src]="currentNetworkInfo()!.icon!" alt="" class="chain-icon" />
        } @else {
          <span class="chain-icon" aria-label="Generic network icon" role="img">🌐</span>
        }
      </div>
      <div class="network-name">
        {{ currentNetworkInfo().name || 'Kaspa L1' }}
      </div>
    </div>

    <kc-icon-button class="settings-icon" icon="icon-settings" variant="secondary" size="md" (buttonClick)="onSettingsClick()" kcTooltip="Settings" tooltipPosition="bottom-center"></kc-icon-button>

    @if (!desktopViewService.isIframe) {
      <kc-icon-button
        class="expand-toggle"
        [icon]="desktopViewService.isExpandedView() ? 'icon-collapse' : 'icon-expand'"
        variant="secondary"
        size="sm"
        (buttonClick)="desktopViewService.toggle()"
        [title]="desktopViewService.isExpandedView() ? 'Compact view' : 'Expand view'"
        [ariaLabel]="desktopViewService.isExpandedView() ? 'Compact view' : 'Expand view'"
      ></kc-icon-button>
    }
  </div>
