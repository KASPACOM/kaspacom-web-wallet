<div class="header-container-home full-height">
  <div class="profile-section">
    <div class="profile-container" (click)="toggleAccountSettings()">
      <app-wallet-profile-orb
        class="profile-container__chain-icon"
      ></app-wallet-profile-orb>
      <div class="profile-container__info">
        <div class="profile-container__wallet-name-section">
          <div class="profile-container__wallet-name">{{ walletName() }}</div>
        </div>
        <div class="profile-container__account-section">
          <div class="profile-container__account-name">{{ accountName() }}</div>
        </div>
      </div>
    </div>
    <app-copy-button
      class="external-copy-button"
      [value]="walletAddress()"
      [size]="'sm'"
      (click)="onCopyButtonClick($event)"
    ></app-copy-button>
  </div>
  <div class="flex align-items-center gap-8">
    <kc-icon
      class="settings-icon"
      [iconClass]="'icon-chain'"
      [size]="'md'"
      (click)="onNetworkClick()"
    ></kc-icon>
    <div class="network-label" (click)="onNetworkClick()"><b>{{ selectedNetwork() }}</b></div>
    <kc-icon
      class="settings-icon"
      [iconClass]="'icon-settings'"
      [size]="'md'"
      (click)="onSettingsClick()"
    ></kc-icon>
  </div>
</div>
