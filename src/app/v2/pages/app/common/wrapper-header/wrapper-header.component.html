@if (router.url === "/app/home") {
  <div class="header-container-home full-height">
    <div class="profile-container">
      <kc-icon
        class="profile-container__chain-icon"
        [iconClass]="'icon-chain'"
      ></kc-icon>
      <div class="profile-container__info">
        <div class="profile-container__account-name">{{ accountName() }}</div>
        <div class="profile-container__address">
          <span>{{ shortenedAddress() }}</span>
          <kc-icon
            class="profile-container__copy-icon"
            [iconClass]="'icon-copy'"
            [size]="'xs'"
            (click)="onCopyAddress()"
          ></kc-icon>
        </div>
      </div>
    </div>
    <kc-icon
      class="settings-icon"
      [iconClass]="'icon-settings'"
      [size]="'md'"
      (click)="onSettingsClick()"
    ></kc-icon>
  </div>
} @else if (router.url === "/app/home/search") {
  <app-search-bar></app-search-bar>
}
