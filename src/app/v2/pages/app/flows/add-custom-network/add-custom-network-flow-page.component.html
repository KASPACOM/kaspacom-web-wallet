<div class="add-network-container full-width full-height flex column p-16 gap-16">

  <kc-dropdown-select
    [options]="presetOptions"
    [placeholder]="'Load a well-known network'"
    [isFullWidth]="true"
    [isSearchable]="true"
    [value]="selectedPresetChainId()"
    (valueChange)="onPresetSelected($any($event))">

    <ng-template #optionTemplate let-option>
      <div class="preset-option">
        @if (getPresetNetworkIcon(option.value)) {
          <img [src]="getPresetNetworkIcon(option.value)!" alt="" class="preset-option-icon" />
        } @else {
          <div class="preset-option-fallback">{{ option.label.charAt(0) }}</div>
        }
        <span>{{ option.label }}</span>
      </div>
    </ng-template>

  </kc-dropdown-select>

  <div class="fields-section flex column gap-12">

    <kc-input
      [infoLabel]="{ label: 'Network Name' }"
      [placeholder]="'e.g. Base, Polygon, Arbitrum'"
      [ngModel]="networkName()"
      (valueChange)="networkName.set($any($event) || '')">
    </kc-input>

    <kc-input
      [infoLabel]="{ label: 'Chain ID' }"
      [placeholder]="'e.g. 8453'"
      [isValid]="!chainIdError()"
      [ngModel]="chainId()"
      (valueChange)="chainId.set(coerceToString($event))">
    </kc-input>
    @if (chainIdError()) {
      <span class="input-error-text">{{ chainIdError() }}</span>
    }

    <kc-input
      [infoLabel]="{ label: 'RPC URL' }"
      [placeholder]="'https://rpc.example.com'"
      [isValid]="!rpcUrlError()"
      [ngModel]="rpcUrl()"
      (valueChange)="rpcUrl.set($any($event) || '')">
    </kc-input>
    @if (rpcUrlError()) {
      <span class="input-error-text">{{ rpcUrlError() }}</span>
    }

    <kc-input
      [infoLabel]="{ label: 'Currency Symbol' }"
      [placeholder]="'ETH'"
      [ngModel]="currencySymbol()"
      (valueChange)="currencySymbol.set($any($event) || '')">
    </kc-input>

    <kc-input
      [infoLabel]="{ label: 'Decimals' }"
      [placeholder]="'18'"
      [isValid]="!decimalsError()"
      [ngModel]="currencyDecimals()"
      (valueChange)="currencyDecimals.set(coerceToString($event))">
    </kc-input>
    @if (decimalsError()) {
      <span class="input-error-text">{{ decimalsError() }}</span>
    }

    <kc-input
      [infoLabel]="{ label: 'Block Explorer URL (optional)' }"
      [placeholder]="'https://explorer.example.com'"
      [isValid]="!explorerUrlError()"
      [ngModel]="explorerUrl()"
      (valueChange)="explorerUrl.set($any($event) || '')">
    </kc-input>
    @if (explorerUrlError()) {
      <span class="input-error-text">{{ explorerUrlError() }}</span>
    }

  </div>

  <div class="action-buttons flex gap-12 mt-auto">
    <kc-button
      [variant]="'secondary'"
      [size]="'m'"
      [text]="'Cancel'"
      class="flex-1"
      (buttonClick)="onCancel()">
    </kc-button>
    <kc-button
      [variant]="'primary'"
      [size]="'m'"
      [text]="isSaving() ? 'Adding...' : 'Add Network'"
      [isDisabled]="isSaving()"
      class="flex-1"
      (buttonClick)="onSave()">
    </kc-button>
  </div>

</div>
