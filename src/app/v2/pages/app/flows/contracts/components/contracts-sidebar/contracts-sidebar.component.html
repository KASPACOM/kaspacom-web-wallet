<div class="contracts-sidebar">
  <div class="contracts-sidebar__brand">
    <div class="contracts-sidebar__brand-icon">
      <kc-icon [iconClass]="'icon-file-02'" [size]="'md'"></kc-icon>
    </div>
    <div class="contracts-sidebar__brand-text">
      <span class="contracts-sidebar__brand-title">Contracts</span>
      <span class="contracts-sidebar__brand-subtitle">SilverScript covenants</span>
    </div>
  </div>

  <nav class="contracts-sidebar__nav">
    @for (item of items(); track item.key) {
      <button
        type="button"
        class="contracts-sidebar__item"
        [class.active]="active() === item.key"
        (click)="select.emit(item.key)"
      >
        <kc-icon [iconClass]="item.iconClass" [size]="'sm'"></kc-icon>
        <span class="contracts-sidebar__item-label">{{ item.label }}</span>
        @if (item.badge !== undefined) {
          <span class="contracts-sidebar__item-badge">{{ item.badge }}</span>
        }
      </button>
    }
  </nav>
</div>
