<kc-dialog [showCloseButton]="true">
    <div class="settings-content" [formGroup]="settingsForm">
        <div class="form-field">
            <div class="slippage-row">
                <kc-input label="Slippage tolerance (%)" placeholder="0.5"
                    formControlName="maxSlippage"></kc-input>
                <div class="slippage-options">
                    <kc-button variant="tag-secondary" size="s" [isSelected]="selectedSlippage() === 0.1" text="0.1%" (buttonClick)="onSlippageClick(0.1)"></kc-button>
                    <kc-button variant="tag-secondary" size="s" [isSelected]="selectedSlippage() === 0.5" text="0.5%" (buttonClick)="onSlippageClick(0.5)"></kc-button>
                    <kc-button variant="tag-secondary" size="s" [isSelected]="selectedSlippage() === 1.5" text="1.5%" (buttonClick)="onSlippageClick(1.5)"></kc-button>
                </div>
            </div>
            <kc-form-error-message
                [control]="settingsForm.get('maxSlippage')"
                fieldName="Slippage"
                validPatternExample="0.5"
                [customErrorMessages]="{
                    min: 'Slippage must be at least 0.01%',
                    max: 'Slippage cannot exceed 50%'
                }">
            </kc-form-error-message>
        </div>

        <div class="form-field">
            <kc-input label="Transaction deadline (minutes)" placeholder="20"
                formControlName="swapDeadline"></kc-input>
            <kc-form-error-message
                [control]="settingsForm.get('swapDeadline')"
                fieldName="Deadline"
                [customErrorMessages]="{
                    min: 'Deadline must be at least 1 minute',
                    max: 'Deadline cannot exceed 4320 minutes (3 days)'
                }">
            </kc-form-error-message>
        </div>

        <kc-button text="Save" variant="primary" [isFullWidth]="true" [isDisabled]="settingsForm.invalid" (buttonClick)="onSave()"></kc-button>
    </div>
</kc-dialog>
