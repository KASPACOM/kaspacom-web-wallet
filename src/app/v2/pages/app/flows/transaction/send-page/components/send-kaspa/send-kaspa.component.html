<div class="send-kaspa-content">
  <!-- Kaspa Info Header -->
  <div class="kaspa-info-header card-0 align-items-center gap-16 p-16">
    <kc-token-logo [ticker]="'KAS'" [size]="'lg'"></kc-token-logo>
    <div class="flex column gap-4">
      <div class="text-gray-90 typo-text-2">Kaspa</div>
      <div class="text-gray-60 typo-text-1">
        Available: {{ availableBalance() | number : "1.0-4" }}&nbsp;KAS
      </div>
    </div>
  </div>

  <div class="send-kaspa-form">
    <!-- Wallet Address Input -->
    <div class="form-field">
      <kc-input
        [label]="'Wallet Address'"
        [placeholder]="'Enter recipient wallet address'"
        [type]="'text'"
        [isFullWidth]="true"
        [isValid]="isAddressValid"
        [invalidReason]="addressErrorMessage"
        [isDisabled]="isLoading"
        [ngModel]="walletAddress"
        (valueChange)="onWalletAddressChange($event)">
        <div (click)="!isLoading && onQrScanClick()" [class]="isLoading ? 'qr-button disabled' : 'qr-button clickable'" rightSideSlot>
          <kc-icon 
            [iconClass]="'icon-qr'" 
            [size]="'xs'" 
            [color]="'var(--gray-60)'"
            class="qr-icon">
          </kc-icon>
        </div>
      </kc-input>
    </div>

    <!-- Amount Input -->
    <div class="form-field">
      <kc-input
        [label]="'Amount of Kaspa'"
        [placeholder]="'0.00'"
        [type]="'number'"
        [min]="0"
        [max]="availableBalance()"
        [isFullWidth]="true"
        [isValid]="isAmountValid"
        [invalidReason]="amountErrorMessage"
        [isDisabled]="isLoading"
        [ngModel]="kaspaAmount"
        (valueChange)="onAmountChange($event)">
        <div (click)="!isLoading && onMaxAmountClick()" [class]="isLoading ? 'max-text disabled' : 'max-text clickable'" rightSideSlot>
          <span>Max</span>
        </div>
      </kc-input>
    </div>

    <!-- Replace By Fee Checkbox -->
    <div class="form-field">
      <kc-checkbox
        [label]="'Replace By Fee (RBF)'"
        [isChecked]="replaceByFee"
        [isDisabled]="isLoading"
        (checkedChange)="onRbfChange($event)"
        size="md">
      </kc-checkbox>
    </div>

    <!-- Send Button -->
    <div class="form-field">
      <kc-button
        [text]="isLoading ? 'Sending...' : 'Send'"
        [variant]="'primary'"
        [isFullWidth]="true"
        [isLoading]="isLoading"
        [isDisabled]="!isAddressValid || !isAmountValid || isLoading || !walletAddress || !kaspaAmount"
        (buttonClick)="onSendClick()">
      </kc-button>
    </div>
  </div>
</div>
