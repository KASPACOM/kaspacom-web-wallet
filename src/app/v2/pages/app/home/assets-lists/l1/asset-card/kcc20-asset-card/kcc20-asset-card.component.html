<div
  class="asset-card card-0 full-width flex align-items-center justify-content-between p-16"
>
  <div class="asset-card__info flex align-items-center gap-16">
    <kcc20-token-logo
      class="asset-card__logo"
      [covenantId]="holding()?.covenantId || ''"
      [size]="'lg'"
    />
    <div class="flex column gap-4">
      <div class="text-gray-90">{{ holding()?.name || holding()?.ticker || "" }}</div>
      <div class="text-gray-60 typo-text-1 asset-card__meta">
        {{ holding()?.balance || 0 | number: "1.0-4" }}
        &nbsp;{{ holding()?.ticker || "" | uppercase }}
      </div>
    </div>
  </div>
</div>
