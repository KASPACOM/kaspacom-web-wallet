<div class="create-password-step flex column align-items-center step-layout">
  <div class="step-layout__content">
    <div class="flex column align-items-center gap-32">
      <div class="flex column align-items-center gap-16">
        <span class="typo-title-3">Create Password</span>
        <span class="typo-text-2 text-medium text-align-center"
          >You will use it to unlock your account</span
        >
      </div>
      <div class="password-notice">
        <kc-icon
          iconClass="icon-info"
          [size]="'sm'"
          color="var(--warning-color, #FFB800)"
        ></kc-icon>
        <p class="password-notice__message typo-text-3">
          <span class="password-notice__label">Important:</span>
          This password unlocks your wallet data. If you lose it, you will not be able to recover your wallet data. Please make sure to save it somewhere safe.
        </p>
      </div>

      <form
        class="create-password-form flex column gap-16 full-width align-items-stretch align-self-stretch"
        [formGroup]="passwordForm"
        (ngSubmit)="onSubmit()"
      >
        <kc-input
          class="full-width"
          formControlName="password"
          [label]="'Enter your password'"
          [placeholder]="'Password'"
          [type]="passwordType()"
          [isValid]="!isInvalid('password')"
          [prepadInvalidReason]="true"
          [invalidReason]="getPasswordErrorMessage()"
          (keydown.enter)="onSubmit()"
        >
          <div (click)="togglePwVisibility()" class="clickable" rightSideSlot>
            <kc-icon iconClass="{{ passwordIcon() }}" [size]="'xs'"></kc-icon>
          </div>
        </kc-input>
        <kc-input
          class="full-width"
          formControlName="confirmPassword"
          [label]="'Confirm your password'"
          [placeholder]="'Confirm password'"
          [type]="passwordConfirmType()"
          [isValid]="!isInvalid('confirmPassword')"
          [prepadInvalidReason]="true"
          [invalidReason]="getConfirmPasswordErrorMessage()"
          (keydown.enter)="onSubmit()"
        >
          <div
            (click)="toggleConfirmPwVisibility()"
            class="clickable"
            rightSideSlot
          >
            <kc-icon [iconClass]="passwordConfirmIcon()" [size]="'xs'"></kc-icon>
          </div>
        </kc-input>
      </form>
    </div>
  </div>

  <div class="step-layout__buttons">
    <kc-button
      [isFullWidth]="true"
      type="submit"
      [text]="'Continue'"
      [isDisabled]="!passwordForm.valid"
      (buttonClick)="onSubmit()"
    ></kc-button>
  </div>
</div>
