<div class="network-selection-modal">
  <div class="modal-content">
    <div class="networks-list">
      <div
        *ngFor="let network of networks()"
        class="network-item"
        [class.selected]="isCurrentNetwork(network.id)"
        [class.disabled]="isNetworkDisabled(network)"
        (click)="isNetworkDisabled(network) ? null : onNetworkSelect(network.id)"
      >
        <div class="network-icon">
          {{ getNetworkIcon(network) }}
        </div>
        <div class="network-info">
          <div class="network-name">{{ network.displayName }}</div>
          <div class="network-description">{{ network.name }}</div>
        </div>
        <div class="network-status">
          <kc-icon
            *ngIf="isCurrentNetwork(network.id)"
            [iconClass]="'icon-check'"
            [size]="'sm'"
          ></kc-icon>
        </div>
      </div>
    </div>
  </div>
</div>
