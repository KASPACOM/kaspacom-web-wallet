<div class="address-smart-input">
	<kc-input
		[label]="label"
		[placeholder]="placeholder"
		[type]="'text'"
		[isFullWidth]="isFullWidth"
		[isValid]="(isResolving() || isDomainCandidate()) ? true : (displayIsValid() && !resolveError())"
		[invalidReason]="(isResolving() || isDomainCandidate()) ? '' : (resolveError() || displayInvalidReason())"
		[isDisabled]="isDisabled"
		[ngModel]="value"
		(valueChange)="onInputChange($event)">
		<!-- Right slot: QR and spinner -->
		<div class="right-slot" rightSideSlot>
			@if (isResolving()) {
				<kc-spinner [size]="'xs'"></kc-spinner>
			} @else if (showQrButton) {
				<div (click)="!isDisabled && qrClick.emit()" [class]="isDisabled ? 'qr-button disabled' : 'qr-button clickable'">
					<kc-icon [iconClass]="'icon-qr'" [size]="'xs'" [color]="'var(--gray-60)'"></kc-icon>
				</div>
			}
		</div>
	</kc-input>

	@if (resolvedAddress() && resolvedDomain() && value && !isResolving()) {
		<div class="resolved-address flex align-items-center gap-8">
			<div class="font-mono">{{ shortenAddress(resolvedAddress()) }}</div>
			<app-copy-button [value]="resolvedAddress()" [size]="'xs'"></app-copy-button>
		</div>
		<!-- Warning text as required by KNS documentation -->
		<div class="kns-warning-text">
			Please verify the resolved address before sending. Transactions cannot be reversed.
		</div>
	}
</div>
